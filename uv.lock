    { name = "scikit-learn", version = "1.8.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version == '3.13.*'" },
    { name = "scikit-learn", version = "1.9.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version != '3.13.*'" },
]
torch = [
    { name = "torch", version = "2.12.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version == '3.13.*' and ((platform_machine == 'arm64' and sys_platform == 'darwin') or sys_platform == 'linux')" },
