# Pre-commit hooks validation workflow.
# Runs all configured pre-commit hooks to validate code quality.
# Checks formatting, linting, and other code quality rules.

name: Pre-commit
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Run pre-commit hooks to validate code quality
  pre-commit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Install the dependencies
        run: |
          uv sync --locked --group dev

      - name: Run pre-commit hooks on all files
        run: |
          uv run --no-sync pre-commit run --show-diff-on-failure --color=always --all-files
