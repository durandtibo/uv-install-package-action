# Action test workflow (local version).
# Tests the version of the action in this checkout with each optional
# dependency of the package, and with edge cases.

name: Test Action (Local)
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
  workflow_dispatch: # to trigger manually

permissions:
  contents: read

jobs:
  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-deps:
    uses: ./.github/workflows/lib-get-package-deps.yaml

  # One job per optional dependency, driven by get-deps instead of a
  # hardcoded list.
  test-dep:
    needs: get-deps
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-deps.outputs.extras) }}
    uses: ./.github/workflows/ci-test-action.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-deps.outputs.package_versions)[matrix.package-name]) }}
      action-ref: local
      test-matrix: ${{ inputs.test-matrix }}

  edge-cases:
    uses: ./.github/workflows/ci-test-edge-cases.yaml
    with:
      action-ref: local
