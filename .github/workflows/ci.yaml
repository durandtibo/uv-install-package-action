# Main CI workflow that orchestrates all quality checks and tests.
# Runs on pull requests, pushes to main, a nightly schedule, and manual dispatch.
# Validates code quality and tests the action (local version) and its shell scripts.
#
# Deliberately NOT called from here:
#   - ci-verify-workflows.yaml: lints .github/workflows/* itself, so it
#     triggers on its own.
#   - nightly.yaml: tests the released (stable) version of the action
#     on its own schedule.

name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "10 9 * * *" # Run nightly at 9:10 AM UTC to catch issues from external changes
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared python-version/OS matrix once, and pass it down to every
  # job below that needs it.
  get-matrix:
    permissions:
      contents: read
    uses: ./.github/workflows/lib-get-test-matrix.yaml

  # Verify code formatting and linting
  format:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-format.yaml

  # Run pre-commit hooks for code quality
  pre-commit:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-pre-commit.yaml

  # Run functional tests across multiple Python versions and OS
  python:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/ci-test.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Run the shell unit tests
  shell:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/ci-shell.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}

  # Test the local version of the action with different dependency versions
  action:
    permissions:
      contents: read
    needs: get-matrix
    uses: ./.github/workflows/ci-action.yaml
    with:
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
