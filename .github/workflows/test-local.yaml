name: Test - Action (local)
on:
  workflow_call:
  workflow_dispatch:  # to trigger manually

permissions:
  contents: read

jobs:
  get-versions:
    uses: ./.github/workflows/get-versions.yaml

  test:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        package:
          - click
          - jax
          - matplotlib
          - numpy
          - pandas
          - polars
          - pyarrow
          - pydantic
          - requests
          - safetensors
          - scikit-learn
          - scipy
          - torch
          - xarray
    uses: ./.github/workflows/test-action.yaml
    with:
      package-name: ${{ matrix.package }}
      package-versions: ${{ toJson(fromJson(needs.get-versions.outputs.package_versions)[matrix.package]) }}
      action-ref: local

  edge-cases:
    uses: ./.github/workflows/test-edge-cases.yaml
    with:
      action-ref: local
