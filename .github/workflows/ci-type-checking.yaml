# Type checking workflow.
# Validates the type annotations of the Python files (dev/ and tests/) with ty and pyright
# (inv types.check --complete), to catch type-related bugs before runtime.

name: Type Checking
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  type-checking:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # The optional dependencies are installed too, so the type checkers resolve the imports of
      # the functional tests.
      - name: Set up python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2

      # Type-check the Python files with ty and pyright
      - name: Check types
        run: |
          inv types.check --complete
