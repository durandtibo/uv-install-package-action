# Workflow testing the action from the current repository code (uses: ./)
# on multiple Python versions and operating systems, with each optional
# dependency of the package and with edge cases.
# The released version is tested by nightly-test-released.yaml.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-deps:
    uses: ./.github/workflows/lib-get-package-deps.yaml
    permissions:
      contents: read

  # One job per optional dependency, driven by get-deps instead of a
  # hardcoded list.
  test-dep:
    needs: get-deps
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-deps.outputs.extras) }}
    uses: ./.github/workflows/ci-action-deps.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-deps.outputs.package_versions)[matrix.package-name]) }}
      action-ref: local
      test-matrix: ${{ inputs.test-matrix }}
    permissions:
      contents: read

  edge-cases:
    uses: ./.github/workflows/ci-action-edge-cases.yaml
    with:
      action-ref: local
    permissions:
      contents: read
