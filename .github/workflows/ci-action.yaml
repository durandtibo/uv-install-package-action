# Workflow testing the action in a real workflow. One file tests both versions:
#   - use-released: false (default, called by ci.yaml): the action from the current checkout
#     (uses: ./), i.e. the version that is not released yet.
#   - use-released: true (called by nightly.yaml): the latest released action, to catch
#     regressions in what consumers pick up. Update the pinned release in ci-action-deps.yaml and
#     ci-action-edge-cases.yaml when a new version is released (bot-pin-action.yaml may do it).
# Two levels of tests, both with the same cases for the two versions:
#   - general behaviour (ci-action-deps.yaml): each optional dependency of the package, on the
#     full matrix (os_matrix x python_versions x package versions)
#   - edge cases (ci-action-edge-cases.yaml): a table of cases, on one runner
# The matrix comes from lib-get-test-matrix.yaml; run alone (workflow_dispatch), the workflow loads
# it itself.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false
  workflow_dispatch: # to trigger manually
    inputs:
      use-released:
        description: "Test the latest released action instead of the current checkout"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Only when run alone: a caller passes test-matrix, a manual run has to load it.
  get-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-deps:
    uses: ./.github/workflows/lib-get-package-deps.yaml
    permissions:
      contents: read

  # One job per optional dependency, driven by get-deps instead of a
  # hardcoded list.
  test-dep:
    needs: [get-deps, get-matrix]
    if: ${{ !cancelled() && needs.get-deps.result == 'success' && (needs.get-matrix.result == 'success' || needs.get-matrix.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-deps.outputs.extras) }}
    uses: ./.github/workflows/ci-action-deps.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-deps.outputs.package_versions)[matrix.package-name]) }}
      use-released: ${{ inputs.use-released }}
      test-matrix: ${{ inputs.test-matrix || needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read

  edge-cases:
    uses: ./.github/workflows/ci-action-edge-cases.yaml
    with:
      use-released: ${{ inputs.use-released }}
    permissions:
      contents: read
