# Reusable workflow for testing the action with specific dependency versions.
# Called by ci-action.yaml, with use-released false (current checkout) or true (latest release).
# Update the pinned release below when a new version is released.

name: Test Action with Dependency Version
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
      package-versions:
        type: string
        required: true
      use-released:
        description: "Test the latest released action instead of the current checkout"
        type: boolean
        required: false
        default: false
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
        package-version: ${{ fromJson(inputs.package-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install packages
        run: |
          uv pip install pytest

      - name: Install valid package version (local)
        if: ${{ !inputs.use-released }}
        id: install-package-local
        uses: ./
        with:
          package-name: ${{ inputs.package-name }}
          package-version: ${{ matrix.package-version }}
          python-version: ${{ matrix.python-version }}

      - name: Install valid package version (released)
        if: ${{ inputs.use-released }}
        id: install-package-released
        uses: durandtibo/uv-install-package-action@fe64eac38f69e851b5e79b74ee255ed95a159bc0 # ratchet:durandtibo/uv-install-package-action@v0.2.0
        with:
          package-name: ${{ inputs.package-name }}
          package-version: ${{ matrix.package-version }}
          python-version: ${{ matrix.python-version }}

      # An output regression fails here instead of silently skipping the functional tests.
      # `installed` and `installed-version` do not exist in the released version. The install steps
      # have no continue-on-error: reaching this step means that the action succeeded.
      - name: Check the outputs
        shell: bash
        env:
          CASE: '{"id":"install-package","expect":"success"}'
          OUTCOME: success
          USE_RELEASED: ${{ inputs.use-released }}
          VALID: ${{ steps.install-package-local.outputs.is-valid-version || steps.install-package-released.outputs.is-valid-version }}
          INSTALLED: ${{ steps.install-package-local.outputs.installed }}
          INSTALLED_VERSION: ${{ steps.install-package-local.outputs.installed-version }}
        run: |
          set -euo pipefail
          ./dev/check_action_case.sh

      - name: Run functional tests
        if: steps.install-package-local.outputs.is-valid-version == 'true' || steps.install-package-released.outputs.is-valid-version == 'true'
        run: |
          make test-functional
