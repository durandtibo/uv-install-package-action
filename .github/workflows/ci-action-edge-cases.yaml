# Reusable workflow testing the action on edge cases, on one runner. The cases are data: one row
# of tests/action_cases.json per matrix cell, so a new case is a new row, not a new job. Each case
# runs the action once and asserts the outcome (success or failure) and the outputs with
# dev/check_action_case.sh, shared by the local and the released run: Python versions with a
# free-threaded build, no/incorrect/patch Python version, an invalid version in `skip` and `fail`
# mode, wildcards, an invalid mode, an invalid package name or version, and `uv-args`.
# Called by ci-action.yaml, with use-released false (current checkout, from ci.yaml) or true
# (latest release, from nightly.yaml). Update the pinned release below when a new version is released.
#
# A row has "released": false until the last release has the feature: the released run skips it.
# The columns of a row are described in dev/check_action_case.sh. The row inputs are the inputs of
# the action; the other fields are:
#   id               name of the case
#   setup-python     Python (and build) given to setup-uv (default 3.14)
#   expect           `success` or `failure`: expected outcome of the action step
#   valid, installed expected outputs `is-valid-version` and `installed` (not asserted when absent)
#   version-prefix   expected prefix of the output `installed-version` (not asserted when absent)
#
# A case that expects a failure follows a positive run of the action on the same runner (the
# default numpy install), so that it cannot fail for the wrong reason (no uv, no network). The case
# `uv-args ... unreachable index` installs another package (six), because uv does not query the
# index for a package that is already installed.

name: Test Action Edge Cases
on:
  workflow_call:
    inputs:
      use-released:
        description: "Test the latest released action instead of the current checkout"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  # The cases of the edge case tests, as a matrix. The released run only gets the rows that the
  # last release supports.
  get-cases:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Read the cases
        id: cases
        shell: bash
        env:
          USE_RELEASED: ${{ inputs.use-released }}
        run: |
          set -euo pipefail
          if [ "$USE_RELEASED" = "true" ]; then
            cases=$(jq -c 'map(select(.released))' tests/action_cases.json)
          else
            cases=$(jq -c '.' tests/action_cases.json)
          fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  # Edge cases on one runner: one row of tests/action_cases.json per cell
  edge-case:
    name: ${{ matrix.case.id }}
    needs: get-cases
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.get-cases.outputs.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.case.setup-python || '3.14' }}
          activate-environment: true

      # A case that expects a failure follows a positive run on the same runner
      - name: Positive run before a failure case (local)
        if: ${{ !inputs.use-released && matrix.case.expect == 'failure' }}
        uses: ./
        with:
          package-name: numpy
          package-version: "2.4.1"
          python-version: "3.14"

      - name: Positive run before a failure case (released)
        if: ${{ inputs.use-released && matrix.case.expect == 'failure' }}
        uses: durandtibo/uv-install-package-action@fe64eac38f69e851b5e79b74ee255ed95a159bc0 # ratchet:durandtibo/uv-install-package-action@v0.2.0
        with:
          package-name: numpy
          package-version: "2.4.1"
          python-version: "3.14"

      - name: Run the action (local)
        if: ${{ !inputs.use-released }}
        id: local
        continue-on-error: true
        uses: ./
        with:
          package-name: ${{ matrix.case.inputs['package-name'] || 'numpy' }}
          package-version: ${{ matrix.case.inputs['package-version'] || '2.4.1' }}
          python-version: ${{ matrix.case.inputs['python-version'] }}
          invalid-version-mode: ${{ matrix.case.inputs['invalid-version-mode'] || 'skip' }}
          uv-args: ${{ matrix.case.inputs['uv-args'] || '' }}

      # The released version has no input invalid-version-mode and uv-args, and the rows that set
      # them have "released": false
      - name: Run the action (released)
        if: ${{ inputs.use-released }}
        id: released
        continue-on-error: true
        uses: durandtibo/uv-install-package-action@fe64eac38f69e851b5e79b74ee255ed95a159bc0 # ratchet:durandtibo/uv-install-package-action@v0.2.0
        with:
          package-name: ${{ matrix.case.inputs['package-name'] || 'numpy' }}
          package-version: ${{ matrix.case.inputs['package-version'] || '2.4.1' }}
          python-version: ${{ matrix.case.inputs['python-version'] }}

      # A skipped step has no outputs and the outcome `skipped`. `installed` and
      # `installed-version` do not exist in the released version.
      - name: Check the case
        shell: bash
        env:
          CASE: ${{ toJson(matrix.case) }}
          USE_RELEASED: ${{ inputs.use-released }}
          OUTCOME: ${{ steps.local.outcome == 'skipped' && steps.released.outcome || steps.local.outcome }}
          VALID: ${{ steps.local.outputs.is-valid-version || steps.released.outputs.is-valid-version }}
          INSTALLED: ${{ steps.local.outputs.installed }}
          INSTALLED_VERSION: ${{ steps.local.outputs.installed-version }}
        run: |
          set -euo pipefail
          ./dev/check_action_case.sh
