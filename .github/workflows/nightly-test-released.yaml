# Workflow testing the latest released action, to catch regressions in what consumers pick up
# on multiple Python versions and operating systems. It mirrors the tests of ci-action.yaml,
# which tests the current checkout instead. Update the pinned release in ci-action-deps.yaml
# and ci-action-edge-cases.yaml when a new version is released.

name: Test Released Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Get the extra names from pyproject.toml, and their version bounds from
  # dev/config/package_versions.json.
  get-deps:
    uses: ./.github/workflows/lib-get-package-deps.yaml
    permissions:
      contents: read

  # One job per optional dependency, driven by get-deps instead of a
  # hardcoded list.
  test-dep:
    needs: get-deps
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJson(needs.get-deps.outputs.extras) }}
    uses: ./.github/workflows/ci-action-deps.yaml
    with:
      package-name: ${{ matrix.package-name }}
      package-versions: ${{ toJson(fromJson(needs.get-deps.outputs.package_versions)[matrix.package-name]) }}
      action-ref: stable
      test-matrix: ${{ inputs.test-matrix }}
    permissions:
      contents: read

  edge-cases:
    uses: ./.github/workflows/ci-action-edge-cases.yaml
    with:
      action-ref: stable
    permissions:
      contents: read
