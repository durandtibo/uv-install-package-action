# Functional test suite workflow.
# Runs the functional tests across multiple Python versions and operating systems.
# Tests both with all dependencies and with minimal dependencies.
# The environment is created with uv from the locked dependencies (uv.lock).

name: Functional Tests
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  # Test with all dependencies across multiple Python versions and operating systems
  all:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the dependencies
        run: |
          uv sync --locked --group dev --all-extras

      - name: Run functional tests
        run: |
          uv run --no-sync pytest tests/functional

  # Test with minimal dependencies to ensure optional dependencies are truly optional
  min:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the dependencies without the optional ones
        run: |
          uv sync --locked --group dev

      - name: Run functional tests
        run: |
          uv run --no-sync pytest tests/functional
