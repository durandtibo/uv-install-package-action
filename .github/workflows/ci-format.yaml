# Formatting and linting workflow.
# Checks the Markdown, shell, TOML, Makefile and YAML files of the repository with the
# make targets, the assertions of the bats tests (make check-bats-assertions), and the Python files
# with ruff (make check-python).

name: Format
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  format:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Format
        run: |
          make format
      - name: Check for changes
        run: |
          git diff --exit-code

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: Lint
        run: |
          make lint
      - name: Check the bats assertions
        run: |
          make check-bats-assertions

  python:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Set up python environment
        uses: durandtibo/setup-venv-uv-action@a592cf6a2b2788f2e5846e4e29151f8895e1c643 # ratchet:durandtibo/setup-venv-uv-action@v0.3.0

      - name: Check the formatting and the lint of the Python files
        run: |
          make check-python
