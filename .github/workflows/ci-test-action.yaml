# Reusable workflow for testing the action with specific dependency versions.
# Used by ci-test-local.yaml and nightly-package.yaml.

name: Test Action with Dependency Version
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
      package-versions:
        type: string
        required: true
      action-ref:
        description: "Which version of the action to test: 'local' (this checkout) or 'stable' (latest released version)"
        type: string
        required: true
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
        package-version: ${{ fromJson(inputs.package-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # ratchet:astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install packages
        run: |
          uv pip install pytest

      - name: Install valid package version (local)
        if: inputs.action-ref == 'local'
        id: install-package-local
        uses: ./
        with:
          package-name: ${{ inputs.package-name }}
          package-version: ${{ matrix.package-version }}
          python-version: ${{ matrix.python-version }}

      - name: Install valid package version (stable)
        if: inputs.action-ref == 'stable'
        id: install-package-stable
        uses: durandtibo/uv-install-package-action@v0.2.0
        with:
          package-name: ${{ inputs.package-name }}
          package-version: ${{ matrix.package-version }}
          python-version: ${{ matrix.python-version }}

      - name: Run functional tests
        if: steps.install-package-local.outputs.is-valid-version == 'true' || steps.install-package-stable.outputs.is-valid-version == 'true'
        run: |
          python -m pytest tests/functional
