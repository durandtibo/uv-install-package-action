# Package version generation workflow.
# Generates configuration for testing different dependency versions.
# Creates a pull request with updated version configuration weekly.

name: Generate Package Versions
on:
  schedule:
    - cron: "0 6 * * 4" # Run every Thursday at 6:00 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  generate-package-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # actions/checkout only needs read; the app token grants write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.TIBOT_CLIENT_ID }}
          private-key: ${{ secrets.TIBOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # ratchet:astral-sh/setup-uv@v10.3.3

      - name: Install the dependencies
        run: |
          uv sync --locked --group dev

      # Generate version configuration for dependency testing
      - name: Generate package versions
        run: |
          uv run --no-sync python dev/generate_versions.py

      # Create a pull request with updated version configuration
      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # ratchet:peter-evans/create-pull-request@v8
        if: always()
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update/versions
          title: Generate package versions
          commit-message: "Generate package versions"
          body: Generate package versions.
          author: ci-bot <${{ secrets.CI_BOT_EMAIL }}>
