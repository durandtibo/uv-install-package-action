# Nightly workflow testing the latest released action (ci-action.yaml with use-released: true),
# to catch regressions in what consumers pick up. The current (unreleased) code is tested nightly by ci.yaml.
#
# Permissions are set at the job level, not the workflow level.

name: Nightly Tests
on:
  schedule:
    - cron: "30 10 * * *" # run at 10:30 AM UTC
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  # Load the shared Python-version and OS matrices from the default config of
  # durandtibo/workflow-config-action once.
  get-matrix:
    uses: ./.github/workflows/lib-get-test-matrix.yaml
    permissions:
      contents: read

  # Test the latest released action: the same ci-action.yaml as ci.yaml, with use-released: true
  test-released:
    needs: get-matrix
    uses: ./.github/workflows/ci-action.yaml
    with:
      use-released: true
      test-matrix: ${{ needs.get-matrix.outputs.test_matrix }}
    permissions:
      contents: read
