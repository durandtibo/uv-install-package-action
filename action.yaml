name: 'uv-install-package'
description: |
  Install Python packages with uv, validating that the requested version is
  installable for your target Python environment via PyPI before installing.

author: "Thibaut Durand"

branding:
  icon: 'box'
  color: 'purple'

inputs:
  package-name:
    description: 'The package name (e.g., numpy, requests, django)'
    required: true
  package-version:
    description: 'The target package version (e.g., "1.2.3", "2.0.0")'
    required: true
  python-version:
    description: 'The Python version to check compatibility against (e.g., "3.10", "3.11", "3.12"). If not provided, the Python version is auto-detected from the current environment.'
    required: false
    default: ''
  uv-args:
    description: 'Additional arguments to pass to uv (e.g., "--index-url https://custom.pypi.org/simple")'
    required: false
    default: ''

outputs:
  is-valid-version:
    description: 'Boolean indicating whether the requested package-version is valid and installable for the target Python version (true or false)'
    value: ${{ steps.check-version.outputs.is-valid-version }}
  installed-successfully:
    description: 'Boolean indicating whether the package was installed successfully'
    value: ${{ steps.install-package.outcome == 'success' }}

runs:
  using: "composite"
  steps:
    # ============================================================================
    # Step 1: Verify uv package manager is available
    # ============================================================================
    # Check that uv is installed and available on the runner. This action
    # requires uv to be pre-installed (e.g., via astral-sh/setup-uv action).
    # Displays the installation path and version for debugging purposes.
    - name: Verify uv is installed
      shell: bash
      run: |
        set -euo pipefail

        echo "🔍 Checking for uv installation..."

        if ! command -v uv &> /dev/null; then
          echo "::error::❌ uv is not installed or not in PATH. Please install uv before using this action (e.g., use astral-sh/setup-uv)"
          exit 1
        fi

        # Display uv location and version information
        echo "✅ uv is installed"
        echo "📍 Location: $(which uv)"
        echo "🏷️  Version: $(uv --version)"

    # ============================================================================
    # Step 2: Validate inputs
    # ============================================================================
    # Validate that required inputs are provided and in expected format.
    # This catches common input errors early with helpful error messages.
    - name: Validate inputs
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        UV_ARGS: ${{ inputs.uv-args }}
      run: |
        set -euo pipefail

        echo "🔍 Validating action inputs..."

        SCRIPT_PATH="${{ github.action_path }}/scripts/validate_inputs.sh"
        if ! ERROR_OUTPUT=$("$SCRIPT_PATH" "$PACKAGE_NAME" "$PACKAGE_VERSION" "$UV_ARGS" 2>&1); then
          echo "::error::❌ $ERROR_OUTPUT"
          exit 1
        fi

        # Relay any non-fatal warnings (e.g. shell metacharacters in uv-args)
        if [ -n "$ERROR_OUTPUT" ]; then
          echo "::warning::⚠️  $ERROR_OUTPUT"
        fi

        echo "✅ Input validation passed"

    # ============================================================================
    # Step 3: Validate and normalize Python version
    # ============================================================================
    # If python-version is not provided, auto-detect from the current environment.
    # Otherwise, validate that the Python version is in major.minor format (e.g., "3.10").
    # If a patch version is provided (e.g., "3.10.1"), it will be normalized
    # to just major.minor (e.g., "3.10"). Free-threaded builds are supported via
    # a trailing 't' (e.g., "3.13t", "3.13.0t"), which is preserved through
    # normalization (e.g., "3.13.0t" -> "3.13t").
    - name: Validate Python version
      id: validate-python-version
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail

        # Auto-detect Python version if not provided
        if [ -z "$PYTHON_VERSION" ]; then
          echo "🔍 Python version not provided, auto-detecting..."
          if ! DETECTED_VERSION=$(python --version 2>&1 | cut -d' ' -f2 | cut -d'.' -f1,2); then
            echo "::error::❌ Failed to auto-detect Python version"
            exit 1
          fi
          PYTHON_VERSION="$DETECTED_VERSION"
          echo "✅ Auto-detected Python version: $PYTHON_VERSION"
        else
          echo "🔍 Validating Python version: $PYTHON_VERSION"
        fi

        # Call the validation script
        SCRIPT_PATH="${{ github.action_path }}/scripts/validate_python_version.sh"
        if ! NORMALIZED_VERSION=$("$SCRIPT_PATH" "$PYTHON_VERSION" 2>&1); then
          echo "::error::❌ Invalid Python version format: '$PYTHON_VERSION'. Expected format: 'X.Y', 'X.Y.Z', or the free-threaded variant 'X.Yt' (e.g., '3.10', '3.10.1', '3.13t')"
          exit 1
        fi

        echo "✅ Python version validated: $NORMALIZED_VERSION"

        # Show warning if patch version was provided and normalized
        TRIMMED_INPUT=$(echo "$PYTHON_VERSION" | xargs)
        if [ "$TRIMMED_INPUT" != "$NORMALIZED_VERSION" ]; then
          echo "::warning::Python version '$PYTHON_VERSION' normalized to '$NORMALIZED_VERSION' (patch version ignored)"
        fi

        # Export the normalized version for use in subsequent steps
        echo "normalized-python-version=$NORMALIZED_VERSION" >> "$GITHUB_OUTPUT"

    # ============================================================================
    # Step 4: Install feu package for version resolution
    # ============================================================================
    # The 'feu' package provides utilities to find compatible package versions
    # based on Python version constraints. We install it with the [cli] extra
    # to get command-line tools.
    - name: Install dependencies
      shell: bash
      run: |
        # Exit immediately if any command fails
        set -euo pipefail
        echo "📦 Installing feu package..."

        # Try to install feu with retry logic for transient network issues
        MAX_ATTEMPTS=3
        ATTEMPT=1
        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          if uv pip install "feu[cli]>=0.8.0a0,<1.0"; then
            echo "✅ Dependencies installed"
            break
          else
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "::error::❌ Failed to install feu package after $MAX_ATTEMPTS attempts. Check network connectivity and ensure uv is configured correctly."
              exit 1
            fi
            echo "::warning::⚠️  Installation attempt $ATTEMPT failed, retrying..."
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          fi
        done

    # ============================================================================
    # Step 5: Check requested version validity
    # ============================================================================
    # Query PyPI (via feu) to check whether the exact requested package
    # version is installable for the target Python version. Unlike the
    # previous behavior, no substitute version is resolved: the action
    # either installs exactly what was requested, or skips installation.
    - name: Check version validity
      id: check-version
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        NORMALIZED_PYTHON_VERSION: ${{ steps.validate-python-version.outputs.normalized-python-version }}
      run: |
        set -euo pipefail

        echo "🔎 Checking version validity..."
        echo "  📦 Package: $PACKAGE_NAME"
        echo "  🎯 Requested version: $PACKAGE_VERSION"
        echo "  🐍 Python version: $NORMALIZED_PYTHON_VERSION"

        # Run feu to check whether the requested version is valid.
        # stdout (the bare True/False result) and stderr (warnings, logs) are
        # captured separately so stray stderr output never gets concatenated
        # into $RESULT and breaks the True/False comparison below.
        STDERR_FILE=$(mktemp)
        if ! RESULT=$(python -m feu check-valid-version \
          --pkg-name="$PACKAGE_NAME" \
          --pkg-version="$PACKAGE_VERSION" \
          --python-version="$NORMALIZED_PYTHON_VERSION" 2>"$STDERR_FILE"); then
          echo "::error::❌ Failed to query PyPI for package '$PACKAGE_NAME'."
          echo "::error::Possible causes:"
          echo "::error::  - Package name is incorrect (verify on https://pypi.org/)"
          echo "::error::  - Network connectivity issues"
          echo "::error::  - PyPI is temporarily unavailable"
          echo "::error::  - Custom index (via uv-args) is not accessible"
          if [ -s "$STDERR_FILE" ]; then
            echo "::error::Details:"
            cat "$STDERR_FILE" >&2
          fi
          rm -f "$STDERR_FILE"
          exit 1
        fi

        if [ -s "$STDERR_FILE" ]; then
          echo "::warning::feu produced additional output on stderr:"
          cat "$STDERR_FILE"
        fi
        rm -f "$STDERR_FILE"

        if [ "$RESULT" = "True" ]; then
          echo "✅ Version '$PACKAGE_VERSION' is valid for Python $NORMALIZED_PYTHON_VERSION"
          echo "is-valid-version=true" >> "$GITHUB_OUTPUT"
        elif [ "$RESULT" = "False" ]; then
          echo "::warning::⚠️  Version '$PACKAGE_VERSION' of '$PACKAGE_NAME' is not valid for Python $NORMALIZED_PYTHON_VERSION. Skipping installation."
          echo "is-valid-version=false" >> "$GITHUB_OUTPUT"
        else
          echo "::error::❌ Unexpected output from feu check-valid-version: '$RESULT'"
          exit 1
        fi

    # ============================================================================
    # Step 6: Install the requested package version
    # ============================================================================
    # Use feu's installer wrapper to install the package with uv, only if
    # Step 5 confirmed the requested version is valid.
    - name: Install package
      id: install-package
      if: steps.check-version.outputs.is-valid-version == 'true'
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        UV_ARGS: ${{ inputs.uv-args }}
      run: |
        set -euo pipefail

        echo "📥 Installing package..."
        echo "  📦 Package: $PACKAGE_NAME"
        echo "  🏷️  Version: $PACKAGE_VERSION"

        # Install the package using feu's installer wrapper
        python -m feu install \
          --installer-name=uv \
          --installer-args="$UV_ARGS" \
          --pkg-name="$PACKAGE_NAME" \
          --pkg-version="$PACKAGE_VERSION"

        echo "::notice::✅ Successfully installed ${PACKAGE_NAME}==${PACKAGE_VERSION}"

    # ============================================================================
    # Step 7: Verify package installation
    # ============================================================================
    # Verify that the installed package can be imported successfully.
    # This catches issues where installation succeeded but the package is broken.
    # Skipped when Step 5 found the requested version invalid (nothing was installed).
    - name: Verify installation
      if: steps.check-version.outputs.is-valid-version == 'true'
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
      run: |
        set -euo pipefail

        echo "🔍 Verifying package installation..."

        # Convert package name to import name (replace hyphens with underscores)
        # This handles common cases like 'scikit-learn' -> 'sklearn'
        SCRIPT_PATH="${{ github.action_path }}/scripts/get_import_name.sh"
        IMPORT_NAME=$("$SCRIPT_PATH" "$PACKAGE_NAME")

        # Try to import with converted name first
        if python -c "import importlib, sys; importlib.import_module(sys.argv[1])" "$IMPORT_NAME" 2>/dev/null; then
          echo "✅ Package '$PACKAGE_NAME' imports successfully as '$IMPORT_NAME'"
        else
          # Fallback: try with original package name (handles edge cases)
          if python -c "import importlib, sys; importlib.import_module(sys.argv[1])" "$PACKAGE_NAME" 2>/dev/null; then
            echo "✅ Package '$PACKAGE_NAME' imports successfully"
          else
            echo "::warning::⚠️  Package installed but could not verify import. This may be normal for:"
            echo "::warning::    - CLI tools without importable modules"
            echo "::warning::    - Packages with non-standard import names"
            echo "::warning::    - Namespace packages"
          fi
        fi
